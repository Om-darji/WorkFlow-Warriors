<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop Authentication</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

    <!-- Left Section -->
    <div class="left-section">

        <div class="left-content">

            <img src="logo.png" alt="Traveloop Logo" class="logo">
            <h1 class="brand-name">Traveloop</h1>

            <h2>Plan Your Dream Journey</h2>

            <p>
                Create personalized itineraries, manage budgets,
                explore destinations and travel smarter.
            </p>

        </div>

    </div>

    <!-- Right Section -->
    <div class="right-section">

        <div class="auth-container">

            <!-- Hidden Radio Buttons -->
            <input type="radio" name="auth-toggle" id="login" checked>
            <input type="radio" name="auth-toggle" id="signup">

            <!-- Tabs -->
            <div class="tabs">
                <label for="login" class="login-tab">Login</label>
                <label for="signup" class="signup-tab">Sign Up</label>
            </div>

            <!-- Forms Wrapper -->
            <div class="form-wrapper">

                <!-- Login Form -->
                <div class="form login-form">

                    <h2>Welcome Back</h2>

                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Enter your password">
                    </div>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                    <button type="submit">Login</button>

                </div>

                <!-- Signup Form -->
                <div class="form signup-form">

                    <h2>Create Account</h2>

                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter your full name">
                    </div>

                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Enter your email">
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="Create password">
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="Confirm password">
                    </div>

                    <button type="submit">Sign Up</button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
