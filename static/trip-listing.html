<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop - My Trips</title>
    <link rel="stylesheet" href="trip-listing.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">

    <nav class="navbar">
        <div class="brand-section">
            <img src="logo.png" alt="Traveloop Logo" class="logo">
            <h1 class="brand-name">Travel Loop</h1>
        </div>
        <div class="profile-circle">👤</div>
    </nav>

    <section class="search-section">
        <input type="text" placeholder="Search your trips..." class="search-box">
        <button class="filter-btn">Group By</button>
        <button class="filter-btn">Filter</button>
        <button class="filter-btn">Sort By</button>
    </section>

    <section class="trip-section">
        <div class="section-header">
            <h2>Ongoing</h2>
            <a href="#" class="see-more">See more &gt;</a>
        </div>

        <div class="trip-card">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" alt="Trip" class="trip-image">
            <div class="trip-info">
                <h3>Goa Beach Escape</h3>
                <p>5 Days • Relaxation • Budget Friendly</p>
            </div>
            <div class="menu-icon">⋮</div>
        </div>
    </section>

    <section class="trip-section">
        <div class="section-header">
            <h2>Up-coming</h2>
            <a href="#" class="see-more">See more &gt;</a>
        </div>

        <div class="trip-card">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800" alt="Trip" class="trip-image">
            <div class="trip-info">
                <h3>Manali Adventure</h3>
                <p>7 Days • Mountains • Trekking</p>
            </div>
            <div class="menu-icon">⋮</div>
        </div>
    </section>

    <section class="trip-section">
        <div class="section-header">
            <h2>Completed</h2>
            <a href="#" class="see-more">See more &gt;</a>
        </div>

        <div class="completed-grid">
            <div class="trip-card small-card">
                <img src="https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?w=800" alt="Trip" class="trip-image">
                <div class="trip-info">
                    <h3>Kerala Journey</h3>
                    <p>4 Days • Nature • Houseboats</p>
                </div>
                <div class="menu-icon">⋮</div>
            </div>

            <div class="trip-card small-card">
                <img src="https://images.unsplash.com/photo-1477587458883-47145ed94245?w=800" alt="Trip" class="trip-image">
                <div class="trip-info">
                    <h3>Jaipur Heritage Tour</h3>
                    <p>3 Days • History • Culture</p>
                </div>
                <div class="menu-icon">⋮</div>
            </div>
        </div>
    </section>

</div>

</body>
</html>
