<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop Authentication</title>
    <link rel="stylesheet" href="login.css">
</head>
<div id="message-box" class="hidden-msg"></div>
<body>

<div class="container">

    <div class="left-section">
        <div class="left-content">
            <img src="logo.png" alt="Traveloop Logo" class="logo">
            <h1 class="brand-name">Traveloop</h1>
            <h2>Plan Your Dream Journey</h2>
            <p>
                Create personalized itineraries, manage budgets,
                explore destinations and travel smarter.
            </p>
        </div>
    </div>

    <div class="right-section">
        <div class="auth-container">
            <input type="radio" name="auth-toggle" id="login" checked>
            <input type="radio" name="auth-toggle" id="signup">

            <div class="tabs">
                <label for="login" class="login-tab">Login</label>
                <label for="signup" class="signup-tab">Sign Up</label>
            </div>

            <div class="form-wrapper">

                <form class="form login-form" id="login-form">
                    <h2>Welcome Back</h2>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="login-email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <button type="submit">Login</button>
                </form>

                <form class="form signup-form" id="signup-form">
                    <h2>Create Account</h2>
                    
                    <div class="photo-upload-section">
                        <div class="photo-preview" id="photo-preview">
                            <span class="photo-icon">📷</span>
                        </div>
                        <div class="input-group">
                            <label>Profile Photo</label>
                            <input type="file" id="signup-photo" accept="image/*" placeholder="Choose a photo">
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label>Full Name</label>
                        <input type="text" id="signup-name" placeholder="Enter your full name" required>
                    </div>
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel" id="signup-phone" placeholder="Enter your phone number">
                    </div>
                    <div class="input-group">
                        <label>City</label>
                        <input type="text" id="signup-city" placeholder="Enter your city">
                    </div>
                    <div class="input-group">
                        <label>Country</label>
                        <input type="text" id="signup-country" placeholder="Enter your country">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="signup-password" placeholder="Create password" required>
                    </div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" id="signup-confirm" placeholder="Confirm password" required>
                    </div>
                    <div class="input-group">
                        <label>Additional Info</label>
                        <textarea id="signup-additional-info" placeholder="Tell us more about yourself..." rows="3"></textarea>
                    </div>
                    <button type="submit">Sign Up</button>
                </form>

            </div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<div id="forgot-password-modal" class="modal-overlay">
    <div class="modal-content">
        <h2>Reset Password</h2>
        <p>Enter your email and a new password to reset.</p>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="reset-email" placeholder="Registered email">
        </div>
        <div class="input-group">
            <label>New Password</label>
            <input type="password" id="reset-new-password" placeholder="Min. 8 characters">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-reset" id="submit-reset">Update Password</button>
        </div>
    </div>
</div>
</body>
</html>
